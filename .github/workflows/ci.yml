name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  java:
    name: Java (consumer-to-zap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer-to-zap
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

  go:
    name: Go (Tel-To-Zap-Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tel-To-Zap-Go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Tel-To-Zap-Go/go.mod
          cache-dependency-path: Tel-To-Zap-Go/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
